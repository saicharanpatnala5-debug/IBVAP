version: '3.8'

services:
  ibvap-backend:
    build: .
    container_name: ibvap_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./ibvap.db
    volumes:
      - ./storage:/app/storage
      - ./ibvap.db:/app/ibvap.db

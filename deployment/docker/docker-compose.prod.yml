version: "3.8"

networks:
  ibvap_tactical_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  ibvap_db_data:
  ibvap_redis_data:
  ibvap_storage_data:
  ibvap_prometheus_data:
  ibvap_grafana_data:

services:
  # 1. PostgreSQL Relational State Store
  postgres:
    image: postgres:16-alpine
    container_name: ibvap_postgres
    restart: unless-stopped
    networks:
      - ibvap_tactical_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibvap_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AdminSecurePassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-ibvap}
    volumes:
      - ibvap_db_data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibvap_admin -d ibvap"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis High-Speed Telemetry & Token Cache
  redis:
    image: redis:7-alpine
    container_name: ibvap_redis
    restart: unless-stopped
    networks:
      - ibvap_tactical_net
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisTacticalPass2026!}"]
    volumes:
      - ibvap_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 3. Central Command FastAPI Backend
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: ibvap_backend
    restart: unless-stopped
    networks:
      - ibvap_tactical_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://ibvap_admin:${POSTGRES_PASSWORD:-AdminSecurePassword2026!}@postgres:5432/ibvap
      - REDIS_URL=redis://:${REDIS_PASSWORD:-RedisTacticalPass2026!}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-ibvap_defense_secret_key_sih_2026_ssb}
      - STORAGE_DIR=/app/storage
    volumes:
      - ibvap_storage_data:/app/storage
      - ../../configs:/app/configs:ro
    expose:
      - "8000"

  # 4. Nginx Tactical Reverse Proxy & SSL Gateway
  nginx:
    image: nginx:alpine
    container_name: ibvap_nginx
    restart: unless-stopped
    networks:
      - ibvap_tactical_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - ibvap_storage_data:/var/www/storage:ro
    depends_on:
      - backend

  # 5. Prometheus Metrics Aggregator
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ibvap_prometheus
    restart: unless-stopped
    networks:
      - ibvap_tactical_net
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ibvap_prometheus_data:/prometheus
    expose:
      - "9090"

  # 6. Grafana Tactical Security Operations Dashboard
  grafana:
    image: grafana/grafana:10.3.3
    container_name: ibvap_grafana
    restart: unless-stopped
    networks:
      - ibvap_tactical_net
    environment:
      - GF_SECURITY_ADMIN_USER=commandant
      - GF_SECURITY_ADMIN_PASSWORD=TacticalCommand2026!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ibvap_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

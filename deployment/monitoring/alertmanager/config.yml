global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'ssb_tactical_dispatcher'

receivers:
  - name: 'ssb_tactical_dispatcher'
    webhook_configs:
      - url: 'http://backend:8000/api/alerts/webhook'
        send_resolved: true
